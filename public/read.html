        document.getElementById('btnHeaderZoomIn')?.addEventListener('click', headerZoomIn);
        document.getElementById('btnHeaderZoomOut')?.addEventListener('click', headerZoomOut);

        /* ─── Mobile Touch Pinch-to-Zoom Listener ─── */
        let initialPinchDistance = 0;
        let initialPinchFontSize = textFontSize;
        let initialPinchPdfZoom = pdfZoomLevel;

        const viewerContainerEl = document.getElementById('viewerContainer');

        viewerContainerEl?.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                initialPinchDistance = dist;
                initialPinchFontSize = textFontSize;
                initialPinchPdfZoom = pdfZoomLevel;
            }
        }, { passive: true });

        viewerContainerEl?.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialPinchDistance > 0) {
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const scale = currentDist / initialPinchDistance;

                if (currentViewMode === 'text') {
                    const newFontSize = Math.min(Math.max(initialPinchFontSize * scale, 0.6), 2.8);
                    textFontSize = Math.round(newFontSize * 100) / 100;
                    updateHeaderZoomUI();
                } else if (currentViewMode === 'pdf') {
                    const newZoom = Math.min(Math.max(initialPinchPdfZoom * scale, 0.5), 3.5);
                    pdfZoomLevel = Math.round(newZoom * 100) / 100;
                    updateHeaderZoomUI();
                }
            }
        }, { passive: true });

        viewerContainerEl?.addEventListener('touchend', (e) => {
            if (e.touches.length < 2 && initialPinchDistance > 0) {
                if (currentViewMode === 'pdf' && globalPdfDoc) {
                    reRenderPdfPages();
                }
                initialPinchDistance = 0;
            }
        }, { passive: true });

        /* ─── Helper: Convert DOCX to PDF using server API ─── */
        async function convertDocxToPdf(docxUrl) {
            // Assume server endpoint: /api/convert-docx?url=...
            const convertUrl = `/api/convert-docx?url=${encodeURIComponent(docxUrl)}`;
            const response = await fetch(convertUrl);
            if (!response.ok) throw new Error(`Conversion failed: ${response.status}`);
            const arrayBuffer = await response.arrayBuffer();
            // Validate PDF header
            const bytes = new Uint8Array(arrayBuffer.slice(0, 5));
            const header = String.fromCharCode.apply(null, Array.from(bytes));
            if (!header.startsWith('%PDF')) {
                throw new Error('Converted document is not a valid PDF');
            }
            return arrayBuffer;
        }

        /* ─── Render PDF from Kenya Law source ─── */
        async function renderKenyaLawPdf(sourceUrl) {
            const pdfUrl = buildKenyaLawPdfUrl(sourceUrl);
            if (!pdfUrl) return false;

            try {
                // First, fetch the source (could be PDF or DOCX)
                const response = await fetch(pdfUrl);
                if (!response.ok) return false;

                const arrayBuffer = await response.arrayBuffer();
                const bytes = new Uint8Array(arrayBuffer.slice(0, 5));
                const header = String.fromCharCode.apply(null, Array.from(bytes));

                if (header.startsWith('%PDF')) {
                    // It's already a PDF, render it
                    await renderPdfFromBuffer(arrayBuffer);
                    return true;
                } else {
                    // Probably a DOCX or other format - attempt conversion
                    // We need to get the actual file URL from the response? The response is the file itself.
                    // We can try to convert the fetched buffer, but we need to send it to server for conversion.
                    // Since we already have the buffer, we can send it via FormData to a conversion endpoint.
                    // Alternatively, we can use the original pdfUrl as the source for conversion.
                    // Let's use the conversion endpoint that takes a URL.
                    // But we already have the file content; we can send it as a blob.
                    // For simplicity, we'll use the conversion endpoint with the URL.
                    // However, if the source URL is the /source endpoint, it might require authentication? We'll assume server can fetch it.
                    // Let's try to convert using the same URL.
                    const convertedPdf = await convertDocxToPdf(pdfUrl);
                    await renderPdfFromBuffer(convertedPdf);
                    return true;
                }
            } catch (e) {
                console.warn('Kenya Law PDF fetch/conversion failed:', e.message);
                return false;
            }
        }

        /* ─── TEXT READER RENDER (restructured) ─── */
        function renderTextReader(data) {
            loadingEl.style.display = 'none';
            pagesContainer.style.display = 'none';
            textReaderContainer.style.display = 'flex';
            pageInfoEl.textContent = 'Text View';

            if (data.year) {
                badgeYear.textContent = data.year;
                badgeYear.style.display = 'inline-block';
            }
            if (data.type) {
                badgeType.textContent = data.type;
                badgeType.style.display = 'inline-block';
            }
            if (data.source) {
                badgeSource.textContent = data.source;
                badgeSource.style.display = 'inline-block';
            }

            textReaderContainer.innerHTML = '';

            const card = document.createElement('div');
            card.className = 'reader-card';
            card.style.fontSize = textFontSize + 'rem';

            const body = document.createElement('div');
            body.className = 'reader-body';
            body.id = 'readerBody';

            let rawHtml = data.html || '';
            let rawText = data.text || '';

            // Check if rawText/rawHtml contains unparsed binary PDF streams
            if ((rawText && rawText.startsWith('%PDF-')) || (rawHtml && rawHtml.startsWith('%PDF-'))) {
                console.warn('[reader] Unparsed binary PDF stream detected in text reader. Switching to PDF view...');
                if (sourceUrl) {
                    currentViewMode = 'pdf';
                    textReaderContainer.style.display = 'none';
                    pagesContainer.style.display = 'flex';
                    pageInfoEl.textContent = 'PDF View';
                    const toggleText = document.getElementById('btnToggleViewText');
                    if (toggleText) toggleText.textContent = 'Text View';
                    const pdfProxyUrl = `/api/pdf-proxy?sourceUrl=${encodeURIComponent(sourceUrl)}`;
                    fetch(pdfProxyUrl).then(r => r.arrayBuffer()).then(buf => renderPdfFromBuffer(buf)).catch(e => showError(e.message));
                    return;
                } else {
                    rawText = 'Document content loaded as PDF binary.';
                }
            }

            // If rawText is missing but we have rawHtml, extract the text so we can restructure it
            if (!rawText && rawHtml) {
                const temp = document.createElement('div');
                temp.innerHTML = rawHtml;
                const removeSelectors = ['header', 'footer', 'nav', 'aside', '.header', '.footer', '.navigation', '.sidebar'];
                for (const sel of removeSelectors) {
                    const els = temp.querySelectorAll(sel);
                    for (const el of els) el.remove();
                }
                rawText = temp.innerText || temp.textContent;
            }

            let contentHtml = '';

            const isAknMarkup = rawHtml && (
                rawHtml.includes('akn-judgment') ||
                rawHtml.includes('la-akoma-ntoso') ||
                rawHtml.includes('akn-paragraph') ||
                rawHtml.includes('tausi-header') ||
                rawHtml.includes('content-and-enrichments')
            );

            if (isAknMarkup) {
                // Parse AKN HTML directly to preserve 100% native document structure
                const temp = document.createElement('div');
                temp.innerHTML = rawHtml;

                // Remove scraping UI artifacts & non-content widgets
                const removeSelectors = [
                    'header', 'footer', 'nav', 'aside', '.header', '.footer', '.navigation', '.sidebar',
                    'la-gutter', 'la-decorate-terms', 'la-decorate-internal-refs', 'la-decorate-external-refs',
                    '.btn', '.btn-primary', '.btn-shrink-sm'
                ];
                for (const sel of removeSelectors) {
                    const els = temp.querySelectorAll(sel);
                    for (const el of els) el.remove();
                }

                // Remove scraping text artifacts like "Loading PDF...", "To the top", etc.
                const allEls = temp.querySelectorAll('*');
                for (const el of allEls) {
                    const t = (el.innerText || '').trim();
                    if (/^Loading PDF/i.test(t) || /^To the top$/i.test(t) || /^Cited documents/i.test(t) || /^Find in document text/i.test(t)) {
                        el.remove();
                    }
                }

                // Remove hrefs to prevent accidental navigation
                const links = temp.querySelectorAll('a');
                for (const link of links) {
                    link.removeAttribute('href');
                    link.style.pointerEvents = 'none';
                    link.style.textDecoration = 'none';
                    link.style.color = 'inherit';
                }

                contentHtml = temp.innerHTML;
            } else if (rawText && rawText.trim().length > 10) {
                // Restructure plain text into legal document format
                const result = restructureLegalText(rawText);
                if (result.hasContent) {
                    contentHtml = result.html;
                } else {
                    contentHtml = `<p>${escapeHtml(rawText)}</p>`;
                }
            } else if (rawHtml && rawHtml.trim().length > 50) {
                // Fallback to basic HTML if text extraction failed completely
                const temp = document.createElement('div');
                temp.innerHTML = rawHtml;
                const links = temp.querySelectorAll('a');
                for (const link of links) {
                    link.removeAttribute('href');
                    link.style.pointerEvents = 'none';
                    link.style.textDecoration = 'none';
                    link.style.color = 'inherit';
                }
                contentHtml = temp.innerHTML;
            } else {
                // Fallback
                contentHtml = `
                    <div style="padding:24px; background:#FDFBF7; border:1px solid rgba(197,160,89,0.3); border-radius:8px; margin-top:16px;">
                        <h3 style="font-family:var(--font-legal); color:var(--accent-green); margin-bottom:8px;">Legal Document Overview</h3>
                        <p style="margin-bottom:12px; color:var(--text-secondary); line-height:1.6;">
                            This legal record (<strong>${escapeHtml(data.title || displayTitle)}</strong>) is referenced in Kenya Law records.
                            ${sourceUrl ? 'You can view the original court record directly or click "Get Summary" to generate an AI Legal Brief.' : ''}
                        </p>
                        <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:16px;">
                            ${sourceUrl ? `<a href="${escapeHtml(sourceUrl)}" target="_blank" rel="noopener noreferrer" class="back-btn" style="background:var(--accent-green); color:white;">Open Original Source ↗</a>` : ''}
                            <button class="btn-icon-text" onclick="document.getElementById('fabSummaryBtn').click()">✨ Generate Legal Brief</button>
                        </div>
                    </div>
                `;
            }

            body.innerHTML = contentHtml;

            const controls = document.createElement('div');
            controls.className = 'reader-controls-bar';
            controls.innerHTML = `
                <input type="text" class="search-input" id="inDocSearch" placeholder="Find in document text…">
                <div style="display:flex; gap:8px;">
                    <button class="btn-icon-text" id="btnFontDec">A−</button>
                    <button class="btn-icon-text" id="btnFontInc">A+</button>
                    <button class="btn-icon-text" id="btnCopyText">Copy text</button>
                    <button class="btn-icon-text" id="btnPrintDoc">Print</button>
                </div>
            `;

            card.appendChild(body);
            card.appendChild(controls);
            textReaderContainer.appendChild(card);

            // Font controls
            document.getElementById('btnFontDec')?.addEventListener('click', () => {
                textFontSize = Math.max(0.85, textFontSize - 0.15);
                card.style.fontSize = textFontSize + 'rem';
            });
            document.getElementById('btnFontInc')?.addEventListener('click', () => {
                textFontSize = Math.min(2.5, textFontSize + 0.15);
                card.style.fontSize = textFontSize + 'rem';
            });
            document.getElementById('btnCopyText')?.addEventListener('click', () => {
                const text = body.innerText || data.text || '';
                navigator.clipboard.writeText(text).catch(() => {
                    const range = document.createRange();
                    range.selectNode(body);
                    window.getSelection().removeAllRanges();
                    window.getSelection().addRange(range);
                    document.execCommand('copy');
                    window.getSelection().removeAllRanges();
                });
                alert('Document text copied to clipboard');
            });
            document.getElementById('btnPrintDoc')?.addEventListener('click', () => {
                window.print();
            });

            // Search
            const searchInput = document.getElementById('inDocSearch');
            if (searchInput) {
                let originalHtml = body.innerHTML;
                searchInput.addEventListener('input', (e) => {
                    const val = e.target.value.trim();
                    if (!val) { body.innerHTML = originalHtml; return; }
                    const regex = new RegExp(`(${val.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');

                    function highlightTextNodes(node) {
                        if (node.nodeType === Node.TEXT_NODE) {
                            const text = node.textContent;
                            if (regex.test(text)) {
                                const span = document.createElement('span');
                                span.innerHTML = text.replace(regex, '<mark class="highlight">$1</mark>');
                                node.parentNode.replaceChild(span, node);
                            }
                        } else if (node.nodeType === Node.ELEMENT_NODE) {
                            if (node.tagName === 'MARK') return;
                            const children = Array.from(node.childNodes);
                            for (const child of children) highlightTextNodes(child);
                        }
                    }
                    body.innerHTML = originalHtml;
                    highlightTextNodes(body);
                });
                setTimeout(() => { originalHtml = body.innerHTML; }, 50);
            }
        }

        /* ─── LEGAL TEXT RESTRUCTURING ENGINE ─── */
        function isLegalHeading(line) {
            const t = line.trim();
            if (!t) return false;
            if (t === t.toUpperCase() && t.length > 8 && t.length < 120) return true;
            if (/^(SECTION|ARTICLE|CHAPTER|PART|TITLE|SUBPART|RULE|ORDER|CLAUSE|SCHEDULE)\s+/i.test(t)) return true;
            if (/^(\d+\.\s*|\d+\.\d+\.\s*|\([a-z]\)\s*|\([ivx]+\)\s*|\([0-9]+\)\s*)/i.test(t) && t.length < 100) return true;
            if (/v\.|versus/i.test(t) && /[A-Z]/.test(t) && t.length < 120) return true;
            if (/^(IN THE MATTER OF|IN RE|BETWEEN|AND|REPUBLIC OF|THE STATE|ATTORNEY GENERAL|JUDGMENT|RULING|ORDER|DECREE|FINDINGS|DETERMINATION)/i
                .test(t) && t.length < 100) return true;
            return false;
        }

        function getHeadingLevel(line) {
            const t = line.trim();
            if (t === t.toUpperCase() && (t.includes('REPUBLIC') || t.includes('KENYA') || t.includes('COURT') || t.includes(
                    'JUDGMENT') || t.includes('RULING'))) return 1;
            if (/^(SECTION|ARTICLE|CHAPTER|PART|TITLE)\s+/i.test(t)) return 2;
            if (/^\d+\.\s/.test(t)) return 3;
            if (/^\d+\.\d+\.\s|^\([a-z]\)\s|^\([ivx]+\)\s/.test(t)) return 4;
            if (/v\.|versus/i.test(t) && /[A-Z]/.test(t)) return 2;
            return 3;
        }

        function isListItem(line) {
            const t = line.trim();
            if (/^[•·●◦‣⁃]\s/.test(t)) return true;
            if (/^(\d+\.\s|\d+\)\s|\([a-z]\)\s|\([ivx]+\)\s|[a-z]\.\s)/i.test(t)) return true;
            return false;
        }

        function isCitationLine(line) {
            const t = line.trim();
            if (/\[\d{4}\]\s*(KECA|KLR|KHC|KESC|KEM|KLR|EA|UKPC|UKSC|HC|CA|SC)\s*\d+/i.test(t)) return true;
            if (/neutral\s*citation/i.test(t)) return true;
            return false;
        }

        function highlightCitations(text) {
            if (!text) return text;
            let result = text.replace(
                /(\[\d{4}\]\s*(KECA|KLR|KHC|KESC|KEM|KLR|EA|UKPC|UKSC|HC|CA|SC)\s*\d+[a-z]?(?:\s*\([^)]*\))?)/gi,
                '<span class="citation-highlight">$1</span>'
            );
            result = result.replace(
                /(Media\s+Neutral\s+Citation\s*:?\s*\[\d{4}\]\s*(KECA|KLR|KHC|KESC|KEM|KLR|EA|UKPC|UKSC|HC|CA|SC)\s*\d+[a-z]?(?:\s*\([^)]*\))?)/gi,
                '<span class="citation-highlight">$1</span>'
            );
            result = result.replace(
                /\b([A-Z][a-z]+(?:\s+[A-Z][a-z]+)*\s+v\.\s+[A-Z][a-z]+(?:\s+[A-Z][a-z]+)*)\b/g,
                (match) => {
                    if (match.includes('class="')) return match;
                    return `<span class="caselaw-highlight">${match}</span>`;
                }
            );
            return result;
        }

        function isSignatureBlock(line) {
            const t = line.trim().toLowerCase();
            if (/date\s*signed|signed\s*at|judge|justice|delivered\s*by|dated\s*this|this\s*\d+\s*day\s*of/i.test(t))
            return true;
            if (/^\s*dated\s*$/i.test(t)) return true;
            if (/^\s*judge\s*$/i.test(t)) return true;
            if (/^\s*justice\s*$/i.test(t)) return true;
            return false;
        }

        function truncateAtSignatureBlock(lines) {
            const result = [];
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                result.push(line);
                if (isSignatureBlock(line)) {
                    // Include the signature block itself and then end
                    let j = i + 1;
                    while (j < lines.length && j < i + 10) {
                        const nt = lines[j].trim();
                        result.push(lines[j]);
                        if (nt === '' || /^[•·\-–—]/.test(nt) || isSignatureBlock(nt) || /^[A-Z\s\.,()]+$/.test(nt) || /\d{4}/.test(nt)) {
                            j++;
                        } else {
                            break;
                        }
                    }
                    break;
                }
            }
            return result;
        }

        function restructureLegalText(rawText) {
            if (!rawText || rawText.trim().length < 5) {
                return { html: '<p><em>No text content available.</em></p>', hasContent: false };
            }
            let text = rawText.replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/\t/g, ' ').replace(/[ \t]+/g, ' ');
            let lines = text.split('\n');
            
            // Remove eKLR scraping UI artifacts
            lines = lines.filter(line => {
                const t = line.trim();
                if (/^Loading PDF/i.test(t)) return false;
                if (/^This document is.*?Do you want to load it/i.test(t)) return false;
                if (/^Load document$/i.test(t)) return false;
                if (/^▲ To the top$/i.test(t)) return false;
                if (/^Cited documents\s*\d*/i.test(t)) return false;
                if (/^Documents citing this one\s*\d*/i.test(t)) return false;
                if (/^\d+\.\s+.*?\d+\s+citations$/i.test(t)) return false;
                if (/^Act\s*\d*$/i.test(t)) return false;
                return true;
            });

            lines = truncateAtSignatureBlock(lines);

            const blocks = [];
            let currentParagraph = [];
            let inList = false;
            let listItems = [];
            let headerPhase = true;

            function flushParagraph() {
                if (currentParagraph.length === 0) return;
                const content = currentParagraph.join(' ');
                if (content.trim()) {
                    const highlighted = highlightCitations(content.trim());
                    if (headerPhase) {
                        if (/^\s*\[?\d+[\.\)]\s*/.test(content) || content.length > 150) {
                            headerPhase = false;
                            blocks.push({ type: 'paragraph', content: highlighted });
                        } else {
                            blocks.push({ type: 'main-heading', content: highlighted });
                            if (/^(JUDGMENT|RULING|ORDER|DECISION|DETERMINATION|DECREE|SENTENCE)$/i.test(content.trim())) {
                                headerPhase = false;
                            }
                        }
                    } else {
                        blocks.push({ type: 'paragraph', content: highlighted });
                    }
                }
                currentParagraph = [];
            }

            function flushList() {
                if (listItems.length === 0) return;
                const highlightedItems = listItems.map(item => highlightCitations(item));
                blocks.push({ type: 'list', items: highlightedItems });
                listItems = [];
                inList = false;
            }

            for (let i = 0; i < lines.length; i++) {
                const raw = lines[i];
                const trimmed = raw.trim();
                if (!trimmed) { flushParagraph();
                    flushList(); continue; }

                if (headerPhase) {
                    if (/^\s*\[?\d+[\.\)]\s*/.test(trimmed)) {
                        flushParagraph();
                        flushList();
                        headerPhase = false;
                        currentParagraph.push(trimmed);
                        continue;
                    }
                    if (isLegalHeading(trimmed) || isCitationLine(trimmed) || trimmed.length < 120) {
                        flushParagraph();
                        flushList();
                        blocks.push({ type: 'main-heading', content: highlightCitations(trimmed) });
                        if (/^(JUDGMENT|RULING|ORDER|DECISION|DETERMINATION|DECREE|SENTENCE)$/i.test(trimmed)) {
                            headerPhase = false;
                        }
                        continue;
                    }
                }

                if (isCitationLine(trimmed) && trimmed.length < 100) {
                    flushParagraph();
                    flushList();
                    blocks.push({ type: 'citation', content: highlightCitations(trimmed) });
                    continue;
                }

                if (isLegalHeading(trimmed)) {
                    flushParagraph();
                    flushList();
                    const level = getHeadingLevel(trimmed);
                    blocks.push({ type: 'heading', content: highlightCitations(trimmed), level: level });
                    continue;
                }

                if (isListItem(trimmed)) {
                    flushParagraph();
                    if (!inList) { inList = true;
                        listItems = []; }
                    listItems.push(trimmed);
                    continue;
                }

                if (inList) {
                    if (/^[a-z]/.test(trimmed) && trimmed.length > 3) {
                        if (listItems.length > 0) {
                            listItems[listItems.length - 1] += ' ' + trimmed;
                        } else { currentParagraph.push(trimmed); }
                        continue;
                    } else { flushList(); }
                }
                currentParagraph.push(trimmed);
            }

            flushParagraph();
            flushList();

            let html = '';
            let inHeadingBlock = false;

            for (let i = 0; i < blocks.length; i++) {
                const block = blocks[i];

                if (block.type === 'main-heading') {
                    if (!inHeadingBlock) {
                        html += `<div class="heading-block">`;
                        inHeadingBlock = true;
                    }
                    html += `<div>${block.content}</div>`;
                    continue;
                } else if (inHeadingBlock) {
                    html += `</div>`;
                    inHeadingBlock = false;
                }

                if (block.type === 'heading') {
                    const level = block.level || 3;
                    const cls = `doc-heading level-${level}`;
                    const tag = level <= 2 ? 'h2' : (level === 3 ? 'h3' : 'h4');
                    html += `<${tag} class="${cls} subheading">${block.content}</${tag}>`;
                    continue;
                }

                if (block.type === 'citation') {
                    html +=
                        `<div class="citation-highlight" style="display:inline-block; padding:0.2em 0.6em; margin:0.2em 0;">${block.content}</div>`;
                    continue;
                }

                if (block.type === 'list') {
                    const firstItem = block.items[0] || '';
                    const isOrdered = /^\d+\.|^\d+\)|^\([0-9]\)/.test(firstItem);
                    const tag = isOrdered ? 'ol' : 'ul';
                    html += `<${tag} class="doc-list">`;
                    for (const item of block.items) {
                        const clean = item.replace(/^[•·●◦‣⁃]\s*/, '')
                            .replace(/^(\d+\.\s*|\d+\)\s*|\([a-z]\)\s*|\([ivx]+\)\s*|[a-z]\.\s*)/i, '');
                        html += `<li>${highlightCitations(clean)}</li>`;
                    }
                    html += `</${tag}>`;
                    continue;
                }

                if (block.type === 'paragraph') {
                    let content = block.content;
                    if (content.length < 3) continue;
                    
                    if (content === content.toUpperCase() && content.length < 60 && !content.includes('.')) {
                        html += `<h4 class="doc-heading level-4 subheading">${content}</h4>`;
                        continue;
                    }
                    
                    content = content.replace(/^\s*\[?\d+[\.\)]\s*/, '');
                    html += `<p class="numbered-paragraph">${content}</p>`;
                    continue;
                }
            }

            if (inHeadingBlock) {
                html += `</div>`;
            }

            return { html: html, hasContent: true };
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        let currentViewMode = 'text';
        let cachedPdfArrayBuffer = null;

        // View toggle handler
        document.getElementById('btnToggleView')?.addEventListener('click', async () => {
            const toggleText = document.getElementById('btnToggleViewText');
            const pdfZoomBar = document.getElementById('pdfZoomBar');

            if (currentViewMode === 'text') {
                currentViewMode = 'pdf';
                if (toggleText) toggleText.textContent = 'Text View';
                textReaderContainer.style.display = 'none';
                pagesContainer.style.display = 'flex';
                pageInfoEl.textContent = 'PDF View';

                if (cachedPdfArrayBuffer) {
                    await renderPdfFromBuffer(cachedPdfArrayBuffer);
                } else if (sourceUrl) {
                    loadingEl.style.display = 'block';
                    try {
                        const pdfProxyUrl = `/api/pdf-proxy?sourceUrl=${encodeURIComponent(sourceUrl)}`;
                        const res = await fetch(pdfProxyUrl);
                        if (res.ok) {
                            cachedPdfArrayBuffer = await res.arrayBuffer();
                            await renderPdfFromBuffer(cachedPdfArrayBuffer);
                        } else {
                            alert('PDF file not available for this document.');
                        }
                    } catch (e) {
                        alert('Could not load PDF: ' + e.message);
                    } finally {
                        loadingEl.style.display = 'none';
                    }
                }
            } else {
                currentViewMode = 'text';
                if (toggleText) toggleText.textContent = 'PDF View';
                pagesContainer.style.display = 'none';
                if (pdfZoomBar) pdfZoomBar.style.display = 'none';
                textReaderContainer.style.display = 'flex';
                pageInfoEl.textContent = 'Text View';
            }
        });

        /* ─── DIRECT PDF DOWNLOAD HANDLER ─── */
        document.getElementById('btnDownloadPdf')?.addEventListener('click', async () => {
            const downloadBtnText = document.getElementById('btnDownloadPdfText');
            const originalText = downloadBtnText ? downloadBtnText.textContent : 'Download PDF';
            if (downloadBtnText) downloadBtnText.textContent = 'Downloading...';

            try {
                let blob = null;
                const safeName = (titleParam || displayTitle || 'eLegal_Document')
                    .replace(/[^a-zA-Z0-9_\-\s]/g, '')
                    .trim()
                    .replace(/\s+/g, '_');
                const downloadFilename = (safeName.toLowerCase().endsWith('.pdf') ? safeName : safeName + '.pdf');

                if (cachedPdfArrayBuffer) {
                    blob = new Blob([cachedPdfArrayBuffer], { type: 'application/pdf' });
                } else if (sourceUrl) {
                    const pdfProxyUrl = `/api/pdf-proxy?sourceUrl=${encodeURIComponent(sourceUrl)}`;
                    const res = await fetch(pdfProxyUrl);
                    if (res.ok) {
                        const buffer = await res.arrayBuffer();
                        cachedPdfArrayBuffer = buffer;
                        blob = new Blob([buffer], { type: 'application/pdf' });
                    } else {
                        throw new Error('PDF file stream unavailable.');
                    }
                } else if (filename && filename !== 'document.pdf') {
                    const res = await fetch(`/read/${encodeURIComponent(filename)}?raw=1`);
                    if (res.ok) {
                        const buffer = await res.arrayBuffer();
                        blob = new Blob([buffer], { type: 'application/pdf' });
                    }
                }

                if (blob) {
                    const blobUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = downloadFilename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
                } else {
                    alert('Could not generate PDF download for this document.');
                }
            } catch (err) {
                alert('Download failed: ' + err.message);
            } finally {
                if (downloadBtnText) downloadBtnText.textContent = originalText;
            }
        });

        /* ─── MAIN LOAD FUNCTION ─── */
        async function loadDocument() {
            loadingEl.style.display = 'block';

            if (!sourceUrl && (!filename || filename === 'document.pdf')) {
                showError('No source URL or file provided');
                return;
            }

            try {
                // Prioritize text & HTML extraction for dynamic, adjustable font size rendering
                const fetchTarget = sourceUrl ?
                    `/api/document-content?sourceUrl=${encodeURIComponent(sourceUrl)}&title=${encodeURIComponent(displayTitle)}&year=${encodeURIComponent(reqYear)}&type=${encodeURIComponent(reqType)}&source=${encodeURIComponent(reqSource)}` :
                    `/read/${encodeURIComponent(filename)}?raw=1`;

                const res = await fetch(fetchTarget);
                if (res.ok) {
                    const data = await res.json();
                    loadedDocData = data;

                    if (data && (data.text || data.html)) {
                        console.log('[reader] Rendered extracted text/HTML with adjustable font sizing and structured legal layout');
                        renderTextReader(data);
                        return;
                    }
                }
            } catch (e) {
                console.warn('[reader] Document content extraction failed:', e.message);
            }

            // Fallback to PDF proxy if text content extraction is unavailable
            if (sourceUrl) {
                try {
                    console.log('[reader] Fetching PDF from proxy for sourceUrl:', sourceUrl);
                    const pdfProxyUrl = `/api/pdf-proxy?sourceUrl=${encodeURIComponent(sourceUrl)}`;
                    const res = await fetch(pdfProxyUrl);
                    if (res.ok) {
                        const arrayBuffer = await res.arrayBuffer();
                        const bytes = new Uint8Array(arrayBuffer.slice(0, 5));
                        const header = String.fromCharCode.apply(null, Array.from(bytes));
                        if (header.startsWith('%PDF')) {
                            cachedPdfArrayBuffer = arrayBuffer;
                            const converted = await processPdfToHtml(arrayBuffer);
                            if (converted) {
                                currentViewMode = 'text';
                                const toggleText = document.getElementById('btnToggleViewText');
                                if (toggleText) toggleText.textContent = 'PDF View';
                                return;
                            }
                            await renderPdfFromBuffer(arrayBuffer);
                            currentViewMode = 'pdf';
                            const toggleText = document.getElementById('btnToggleViewText');
                            if (toggleText) toggleText.textContent = 'Text View';
                            return;
                        }
                    }
                } catch (e) {
                    console.warn('[reader] Direct PDF proxy loading failed:', e.message);
                }
            }

            showError('Could not load or format document text content.');
        }

        loadDocument();
    </script>
