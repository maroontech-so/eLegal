<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eLegal Logo</title>
    <!-- Import a rounded, bold font similar to the original logo -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Center the logo on the page for display purposes */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #ffffff;
        }

        .elegal-logo {
            display: flex;
            align-items: center;
            font-family: 'Fredoka', sans-serif;
            font-size: 110px;
            font-weight: 700;
            /* Very dark purple/black color matching the image */
            color: #000000; 
            user-select: none;
        }

        .logo-e {
            /* Slight adjustments to match the spacing */
            margin-right: 2px;
            letter-spacing: -2px;
        }

        .logo-l-container {
            display: flex;
            align-items: center;
            justify-content: center;
            /* Bright pinkish-red matching the circle */
            background-color: #000000; 
            color: #ffffff;
            width: 170px;
            height: 170px;
            border-radius: 50%;
            margin: 0 8px;
            font-size: 130px;
            /* Adjust the baseline slightly so the L sits perfectly centered */
            padding-bottom: 12px;
            padding-left: 5px; 
            box-sizing: border-box;
        }

        .logo-egal {
            /* Tighten the letter spacing to mimic the connected feel */
            letter-spacing: -3px;
            margin-left: -2px;
        }
    </style>
</head>
<body>

    <div class="elegal-logo">
        <span class="logo-e">e</span>
        <div class="logo-l-container">L</div>
        <span class="logo-egal">egal</span>
    </div>

</body>
</html>
