<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>eLegal | Kenya Judicial Document & Statute Reader</title>
    <meta name="description" content="Read Kenya eKLR court decisions, legal precedents, and Acts of Parliament with AI-grounded legal brief summarization." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://elegal.or.ke/read" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
    <style>
        /* ============================================================
           eLegal - Document Reader
           Complete Responsive UI Redesign
           Fixes: toolbar crowding, horizontal scroll, PDF fit
           ============================================================ */

        /* ── CSS Variables ── */
        :root {
            --app-bg: #F5F7F6;
            --surface-bg: #FFFFFF;
            --text-primary: #1A2E26;
            --text-secondary: #52665E;
            --text-muted: #7A8F87;
            --accent-green: #0D5C3A;
            --accent-green-light: #EAF2ED;
            --accent-green-hover: #0F6B43;
            --accent-gold: #C5A059;
            --accent-gold-light: #FDF6E2;
            --border-color: rgba(13, 92, 58, 0.12);
            --border-light: rgba(13, 92, 58, 0.06);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 6px 24px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
            --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.15);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-full: 9999px;
            --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-legal: 'Source Serif 4', Georgia, 'Times New Roman', serif;
            --font-display: 'Cinzel', 'Times New Roman', serif;
            --transition-fast: 0.15s ease;
            --transition-med: 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            --transition-slow: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            --max-width-content: 900px;
            --toolbar-height: 60px;
            --header-font-size: clamp(1.1rem, 2.5vw, 1.4rem);
        }

        /* ── Reset & Base ── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background: var(--app-bg);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
            width: 100%;
            max-width: 100vw;
        }

        /* ── Scrollbar Styling ── */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* ============================================================
           TOOLBAR
           ============================================================ */
        .toolbar {
            height: var(--toolbar-height);
            min-height: var(--toolbar-height);
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px) saturate(1.2);
            -webkit-backdrop-filter: blur(20px) saturate(1.2);
            border-bottom: 1px solid var(--border-color);
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            flex-shrink: 0;
            gap: 8px;
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            overflow: hidden;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1 1 auto;
            overflow: hidden;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent-green);
            text-decoration: none;
            font-size: 0.8125rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            background: var(--accent-green-light);
            transition: all var(--transition-fast);
            white-space: nowrap;
            border: none;
            cursor: pointer;
            flex-shrink: 0;
        }
        .back-btn:hover {
            background: rgba(13, 92, 58, 0.18);
            transform: translateX(-2px);
        }
        .back-btn:active {
            transform: translateX(0) scale(0.96);
        }
        .back-btn svg {
            flex-shrink: 0;
        }
        .back-btn .back-label {
            display: inline;
        }

        .doc-title {
            font-weight: 700;
            font-size: clamp(0.8rem, 1.6vw, 0.9375rem);
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
            flex: 1 1 auto;
            letter-spacing: -0.01em;
        }

        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            flex-wrap: nowrap;
            overflow: hidden;
        }

        .badge {
            font-size: 0.6875rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: var(--radius-sm);
            background: var(--accent-green-light);
            color: var(--accent-green);
            border: 1px solid rgba(13, 92, 58, 0.12);
            white-space: nowrap;
            letter-spacing: 0.01em;
            display: inline-flex;
            align-items: center;
        }
        .badge-year {
            background: var(--accent-gold-light);
            color: #7A5500;
            border-color: rgba(197, 160, 89, 0.25);
        }
        .badge-type {
            background: #EBF3FA;
            color: #0055A5;
            border-color: rgba(0, 85, 165, 0.15);
        }
        .badge-source {
            background: #F0F0F0;
            color: #4A4A4A;
            border-color: rgba(0, 0, 0, 0.08);
        }

        #pageInfo {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            padding: 3px 10px;
            background: var(--app-bg);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            white-space: nowrap;
        }

        .source-btn,
        .btn-icon-text {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 10px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--surface-bg);
            color: var(--text-primary);
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            text-decoration: none;
            white-space: nowrap;
            font-family: var(--font-body);
            line-height: 1.4;
        }
        .source-btn:hover,
        .btn-icon-text:hover {
            background: var(--accent-green-light);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }
        .source-btn:active,
        .btn-icon-text:active {
            transform: scale(0.96);
        }
        .source-btn svg,
        .btn-icon-text svg {
            flex-shrink: 0;
        }

        #btnBookmark[style*="background: #eff6ff"] {
            background: #E8F0FE !important;
            border-color: #93BBFC !important;
            color: #1A56DB !important;
        }

        #externalLink {
            display: none;
        }
        #externalLink[style*="display: inline-flex"] {
            display: inline-flex !important;
        }

        /* ============================================================
           VIEWER CONTAINER
           ============================================================ */
        .viewer-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: auto;
            padding: 20px 12px 100px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            -webkit-overflow-scrolling: touch;
            width: 100%;
            max-width: 100vw;
            touch-action: manipulation;
        }

        /* ============================================================
           PDF PAGE STYLING (Crisp High-DPI Rendering & Zoom)
           ============================================================ */
        #pagesContainer {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 100%;
        }

        .page-wrapper {
            background: white;
            border-radius: var(--radius-sm);
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.10);
            transition: box-shadow var(--transition-med);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            max-width: 100%;
        }
        .page-wrapper.zoomed {
            max-width: none !important;
        }
        .page-wrapper:hover {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }
        .page-wrapper canvas {
            display: block;
            height: auto;
            max-width: 100%;
            border-radius: var(--radius-sm);
        }
        .page-wrapper.zoomed canvas {
            max-width: none !important;
        }

        /* ============================================================
           FLOATING PDF ZOOM CONTROLS
           ============================================================ */
        .pdf-zoom-bar {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 20, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 30px;
            padding: 5px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 900;
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.35);
        }
        .pdf-zoom-btn {
            background: transparent;
            border: none;
            color: #FFFFFF;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.15s ease;
        }
        .pdf-zoom-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .pdf-zoom-btn:active {
            transform: scale(0.92);
        }
        .pdf-fit-btn {
            width: auto;
            border-radius: 14px;
            padding: 0 12px;
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.18);
        }
        .pdf-zoom-label {
            color: #FFFFFF;
            font-size: 0.8125rem;
            font-weight: 700;
            min-width: 48px;
            text-align: center;
            user-select: none;
            letter-spacing: -0.01em;
        }

        /* ============================================================
           TEXT READER CARD — IMPROVED
           ============================================================ */
        #textReaderContainer {
            width: 100%;
            display: none;
            justify-content: center;
        }
        #textReaderContainer[style*="display: flex"] {
            display: flex !important;
        }

        .reader-card {
            width: 100%;
            max-width: var(--max-width-content);
            background: var(--surface-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            padding: clamp(20px, 4vw, 48px);
            font-family: var(--font-legal);
            font-size: clamp(0.9375rem, 1.2vw, 1.0625rem);
            line-height: 1.8;
            color: #1E1E1E;
            transition: box-shadow var(--transition-med);
            zoom: 1;
        }
        .reader-card:hover {
            box-shadow: var(--shadow-md);
        }

        .reader-header {
            display: none !important;
        }

        .reader-body {
            font-family: var(--font-legal);
            font-size: inherit;
            line-height: inherit;
            color: inherit;
            overflow-wrap: break-word;
            word-wrap: break-word;
            hyphens: auto;
        }

        .reader-body p {
            margin-bottom: 1.8em;
            text-align: justify;
            word-break: break-word;
            hyphens: auto;
            margin-top: 0;
            padding-top: 0;
        }
        
        /* Numbered paragraphs logic */
        .reader-body {
            counter-reset: paragraph;
        }
        .reader-body p.numbered-paragraph {
            position: relative;
            padding-left: 2.5em; /* Indent from the margin */
            margin-bottom: 1.8em; /* Skip a line between paragraphs */
            text-indent: 0 !important;
            text-align: justify;
            line-height: 1.8;
        }
        .reader-body p.numbered-paragraph::before {
            counter-increment: paragraph;
            content: counter(paragraph) ". ";
            position: absolute;
            left: 0;
            top: 0;
            font-weight: bold;
            color: var(--text-primary);
        }

        .reader-body h1,
        .reader-body h2,
        .reader-body h3,
        .reader-body h4,
        .reader-body .doc-heading,
        .reader-body .case-heading {
            font-family: var(--font-body);
            color: var(--text-primary);
            margin-top: 1.5em;
            margin-bottom: 0.8em;
            line-height: 1.4;
            font-weight: 700;
            text-indent: 0;
        }

        /* Central aligned main heading block (Case name, Court, Date, Parties) */
        .reader-body .heading-block {
            text-align: center !important;
            font-weight: bold !important;
            margin-top: 1em;
            margin-bottom: 3.2em; /* Skip two lines before body paragraphs */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.35em;
        }
        .reader-body .heading-block div {
            text-align: center !important;
            font-weight: bold !important;
            margin: 0;
            line-height: 1.4;
            font-size: 1.05rem;
            color: var(--text-primary);
        }

        /* Left aligned subheadings */
        .reader-body h2,
        .reader-body h3,
        .reader-body h4,
        .reader-body .doc-heading.level-2,
        .reader-body .doc-heading.level-3,
        .reader-body .doc-heading.level-4,
        .reader-body .subheading {
            text-align: left !important;
            font-weight: bold !important;
            text-indent: 0 !important;
            padding-left: 0 !important;
            font-size: 1.05rem;
            color: var(--text-primary);
        }

        /* ============================================================
           AKOMA NTOSO (AKN) / eKLR RENDERER STYLING
           ============================================================ */
        .reader-body .akn-header,
        .reader-body .tausi-header {
            text-align: center !important;
            font-weight: bold !important;
            margin-top: 1em;
            margin-bottom: 2.5em;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4em;
        }
        .reader-body .akn-header div,
        .reader-body .tausi-header div,
        .reader-body .akn-docTitle,
        .reader-body .neutral-citation,
        .reader-body .republic-head,
        .reader-body .doc-authority,
        .reader-body .docket-number,
        .reader-body .judges,
        .reader-body .doc-date,
        .reader-body .parties-listing {
            text-align: center !important;
            font-weight: bold !important;
            margin-left: auto !important;
            margin-right: auto !important;
        }
        .reader-body .parties-listing {
            margin-top: 1em;
            margin-bottom: 1em;
        }
        .reader-body .party-listing {
            display: flex;
            justify-content: center;
            gap: 1em;
            font-weight: bold;
        }

        .reader-body .akn-heading,
        .reader-body .akn-division .akn-heading {
            display: block;
            text-align: left !important;
            font-weight: bold !important;
            text-indent: 0 !important;
            margin-top: 1.8em;
            margin-bottom: 0.8em;
            font-size: 1.1em;
            color: var(--text-primary);
        }

        .reader-body .akn-paragraph {
            display: block;
            position: relative;
            padding-left: 2.5em; /* Indented from margin */
            margin-bottom: 1.8em; /* Skip a line between paragraphs */
            text-indent: 0 !important;
            text-align: justify;
            line-height: 1.8;
        }
        .reader-body .akn-paragraph > .akn-num {
            position: absolute;
            left: 0;
            top: 0;
            font-weight: bold;
            color: var(--text-primary);
        }

        .reader-body .akn-subparagraph {
            display: block;
            padding-left: 1.8em;
            margin-top: 0.5em;
            margin-bottom: 0.5em;
        }

        .reader-body .akn-conclusions {
            margin-top: 2.5em;
            padding-top: 1.5em;
            border-top: 1px solid var(--border-color);
            text-align: left;
            font-weight: bold;
            line-height: 1.8;
        }
        .reader-body .akn-conclusions .akn-p,
        .reader-body .akn-conclusions span {
            display: block;
            margin-bottom: 0.4em;
        }

        /* Production Legal Document Renderer Styles */
        .legal-doc {
            font-family: var(--font-legal);
            font-size: 1.05em;
            line-height: 1.85;
            text-align: justify;
            color: var(--text-primary);
        }
        
        .legal-doc h1 {
            text-align: center !important;
            font-size: 1.3em;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 1.5em;
            margin-bottom: 1.5em;
            color: var(--text-primary);
        }
        
        .legal-doc h2 {
            font-size: 1.15em;
            font-weight: bold;
            text-decoration: underline;
            margin-top: 1.8em;
            margin-bottom: 0.8em;
            color: var(--text-primary);
        }
        
        .legal-doc p {
            margin-bottom: 1.5em;
            line-height: 1.8;
            text-indent: 0;
        }
        
        .legal-doc .numbered-para {
            display: flex;
            margin-bottom: 1.5em;
            align-items: flex-start;
        }
        
        .legal-doc .para-number {
            min-width: 38px;
            font-weight: bold;
            color: var(--text-primary);
            flex-shrink: 0;
        }
        
        .legal-doc .para-content {
            flex: 1;
            line-height: 1.8;
        }

        .legal-doc .center-text {
            text-align: center !important;
            font-weight: bold;
            margin: 0.35em 0;
            display: block;
        }

        .citation-highlight {
            background-color: #FEF3C7;
            padding: 0.1em 0.3em;
            border-radius: 3px;
            border-left: 3px solid var(--accent-gold);
            font-weight: 500;
            color: #7A5500;
        }
        .caselaw-highlight {
            background-color: #E0F2FE;
            padding: 0.1em 0.3em;
            border-radius: 3px;
            border-left: 3px solid #0284C7;
            font-weight: 500;
            color: #0369A1;
        }

        .reader-body ul,
        .reader-body ol {
            padding-left: 2.4em;
            margin: 0.4em 0 1.2em 0;
            text-align: justify;
        }
        .reader-body li {
            margin-bottom: 0.25em;
            text-indent: 0;
        }
        .reader-body li p {
            text-indent: 0 !important;
            margin-bottom: 0.2em;
        }

        .reader-body blockquote {
            border-left: 3px solid var(--accent-gold);
            padding-left: 1.4em;
            margin: 1em 0 1.2em 0;
            color: var(--text-secondary);
            font-style: italic;
            text-indent: 0;
        }
        .reader-body blockquote p {
            text-indent: 0 !important;
        }

        .reader-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 1em 0;
            font-size: 0.9em;
            overflow-x: auto;
            display: block;
            text-indent: 0;
        }
        .reader-body th,
        .reader-body td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            text-align: left;
        }
        .reader-body th {
            background: var(--accent-green-light);
            font-weight: 600;
        }

        mark.highlight {
            background-color: #FFE699;
            color: #1A1A1A;
            padding: 1px 4px;
            border-radius: 2px;
            box-shadow: 0 0 0 1px rgba(255, 200, 50, 0.3);
        }

        .reader-body a,
        .reader-body a:link,
        .reader-body a:visited,
        .reader-body a:hover,
        .reader-body a:active {
            color: inherit !important;
            text-decoration: none !important;
            cursor: default !important;
            pointer-events: none !important;
        }

        .reader-controls-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid var(--border-light);
        }
        .reader-controls-bar .search-input {
            flex: 1 1 180px;
            min-width: 120px;
            padding: 7px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.8125rem;
            font-family: var(--font-body);
            outline: none;
            background: var(--app-bg);
            transition: all var(--transition-fast);
            color: var(--text-primary);
        }
        .reader-controls-bar .search-input:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 0 3px rgba(13, 92, 58, 0.12);
            background: white;
        }
        .reader-controls-bar .search-input::placeholder {
            color: var(--text-muted);
        }
        .reader-controls-bar>div {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        /* ============================================================
           FAB - FLOATING ACTION BUTTON
           ============================================================ */
        .fab-summary-btn {
            position: fixed;
            bottom: clamp(20px, 4vh, 32px);
            right: clamp(16px, 3vw, 32px);
            z-index: 990;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: black;
            color: #FFFFFF;
            font-family: var(--font-body);
            font-size: clamp(0.8125rem, 1vw, 0.9375rem);
            font-weight: 700;
            padding: clamp(10px, 1.2vh, 14px) clamp(16px, 2.5vw, 26px);
            border-radius: var(--radius-full);
            box-shadow: 0 8px 28px -4px rgba(0, 0, 0, 0.45), 0 4px 12px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: all var(--transition-med);
            letter-spacing: 0.01em;
            user-select: none;
            white-space: nowrap;
        }
        .fab-summary-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 14px 36px -6px rgba(13, 92, 58, 0.55), 0 6px 16px rgba(0, 0, 0, 0.12);
            background: black;
            border-color: #E2C278;
        }
        .fab-summary-btn:active {
            transform: translateY(-1px) scale(0.96);
        }
        .fab-summary-btn svg {
            flex-shrink: 0;
        }

        /* ============================================================
           SUMMARY MODAL / DRAWER
           ============================================================ */
        .summary-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 20, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 1000;
            display: flex;
            justify-content: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition-med);
        }
        .summary-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .summary-drawer {
            width: 100%;
            max-width: 540px;
            height: 100%;
            background: var(--surface-bg);
            box-shadow: -8px 0 40px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform var(--transition-slow);
            border-radius: 0;
        }
        .summary-overlay.active .summary-drawer {
            transform: translateX(0);
        }

        .summary-header {
            padding: clamp(14px, 2vh, 20px) clamp(18px, 3vw, 28px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #F9FBF9;
            flex-shrink: 0;
            gap: 12px;
        }
        .summary-header>div {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .summary-drawer-title {
            font-family: var(--font-display);
            font-size: clamp(0.9375rem, 1.4vw, 1.125rem);
            font-weight: 700;
            color: var(--accent-green);
            white-space: nowrap;
        }
        .summary-close-btn {
            background: none;
            border: none;
            font-size: 1.6rem;
            line-height: 1;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            transition: all var(--transition-fast);
            font-weight: 300;
        }
        .summary-close-btn:hover {
            color: var(--text-primary);
            background: rgba(0, 0, 0, 0.05);
        }

        .summary-body {
            flex: 1;
            overflow-y: auto;
            padding: clamp(20px, 3vh, 32px) clamp(18px, 3vw, 28px);
            font-family: var(--font-body);
            font-size: clamp(0.875rem, 1vw, 0.9375rem);
            line-height: 1.7;
            color: var(--text-primary);
            -webkit-overflow-scrolling: touch;
        }
        .summary-body h4 {
            font-family: var(--font-display);
            font-size: clamp(0.875rem, 1.1vw, 1rem);
            color: var(--accent-green);
            margin-top: 22px;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(13, 92, 58, 0.08);
            padding-bottom: 5px;
            letter-spacing: 0.01em;
        }
        .summary-body h4:first-child {
            margin-top: 0;
        }
        .summary-body p {
            margin-bottom: 12px;
            text-align: justify;
        }
        .summary-body ul,
        .summary-body ol {
            padding-left: 1.4em;
            margin-bottom: 12px;
        }
        .summary-body li {
            margin-bottom: 5px;
        }
        .summary-body strong {
            color: var(--accent-green);
        }
        .summary-body .state-message {
            text-align: center;
            padding: 40px 16px;
            color: var(--text-secondary);
        }
        .summary-body .state-message h3 {
            font-family: var(--font-body);
            font-size: 1.05rem;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        .summary-body .error-msg {
            color: #DC2626;
        }

        .summary-footer {
            padding: clamp(12px, 1.5vh, 18px) clamp(18px, 3vw, 28px);
            border-top: 1px solid var(--border-color);
            background: #F9FBF9;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .summary-footer .btn-icon-text {
            font-size: 0.8125rem;
            padding: 6px 14px;
        }

        /* ============================================================
           STATE MESSAGES
           ============================================================ */
        .state-message {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            max-width: 520px;
            margin: auto;
            width: 100%;
        }
        .state-message h3 {
            font-size: clamp(1rem, 1.6vw, 1.125rem);
            color: var(--text-primary);
            margin-bottom: 6px;
            font-family: var(--font-body);
            font-weight: 600;
        }
        .state-message p {
            font-size: clamp(0.875rem, 1vw, 0.9375rem);
            color: var(--text-muted);
        }
        .error-msg {
            color: #DC2626 !important;
        }
        .error-msg h3 {
            color: #B91C1C !important;
        }

        /* ============================================================
           RESPONSIVE BREAKPOINTS
           ============================================================ */

                padding: 0 14px;
            }
            .doc-title {
                max-width: 280px;
            }
            .reader-card {
                padding: 32px;
            }
            .summary-drawer {
                max-width: 480px;
            }

                min-height: 56px;

            .toolbar-left {
                gap: 8px;
            }
            .back-btn {

            }
            .back-btn .back-label {

            }
            .doc-title {

            }

            .btn-icon-text .btn-label {

            }
            .viewer-container {

            }

                padding: 5px 10px;
            }
            .summary-drawer {
                max-width: 420px;
            }
            .fab-summary-btn {
                bottom: 18px;
                right: 14px;
                padding: 10px 16px;
                font-size: 0.75rem;
            }
            .fab-summary-btn svg {
                width: 16px;
                height: 16px;
            }
        }

        @media (max-width: 600px) {
            .toolbar {
                padding: 0 8px;
                height: 50px;

            .toolbar-right {

            .badge,

            .btn-icon-text:not(#btnBookmark):not(#externalLink) {
                display: none !important;
            }
            #btnBookmark,
            #externalLink {
                display: inline-flex !important;
                padding: 4px 6px;
                font-size: 0;
                min-width: 30px;
                justify-content: center;
            }
            #btnBookmark svg,
            #externalLink svg {
                width: 16px;
                height: 16px;
                margin: 0;
            }
            #btnBookmark span,
            #externalLink span {
                display: none;
            }
            #externalLink[style*="display: inline-flex"] {
                display: inline-flex !important;
            }
            .viewer-container {
                padding: 12px 6px 70px 6px;
            }
            #pagesContainer {
                gap: 12px;
            }
            .page-wrapper {
                border-radius: 4px;
            }
            .reader-card {
                padding: 18px 14px;
                border-radius: var(--radius-md);
                font-size: 0.875rem;
                line-height: 1.7;
            }
            .reader-body p {
                text-align: left;
                text-indent: 1.8em;
            }
            .reader-controls-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
                margin-top: 14px;
                padding-top: 12px;
            }
            .reader-controls-bar .search-input {
                width: 100%;
                flex: 1 1 auto;
                min-width: 0;
                font-size: 0.75rem;
                padding: 6px 10px;
            }
            .reader-controls-bar>div {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                justify-content: center;
            }
            .reader-controls-bar>div .btn-icon-text {
                font-size: 0.6875rem;
                padding: 4px 10px;
            }
            .summary-overlay {
                justify-content: center;
                align-items: flex-end;
            }
            .summary-drawer {
                max-width: 100%;
                max-height: 92vh;
                border-radius: var(--radius-lg) var(--radius-lg) 0 0;
                transform: translateY(100%);
                height: auto;
                min-height: 60vh;
                max-height: 92vh;
            }
            .summary-overlay.active .summary-drawer {
                transform: translateY(0);
            }
            .summary-header {
                padding: 12px 16px;
                border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            }
            .summary-drawer-title {
                font-size: 0.875rem;
            }
            .summary-body {
                padding: 16px;
                font-size: 0.8125rem;
            }
            .summary-footer {
                padding: 12px 16px;
                justify-content: center;
            }
            .summary-footer .btn-icon-text {
                font-size: 0.75rem;
                padding: 5px 12px;
            }
            .fab-summary-btn {
                bottom: 14px;
                right: 12px;
                padding: 8px 14px;
                font-size: 0.6875rem;
                gap: 6px;
                border-width: 1.5px;
            }
            .fab-summary-btn svg {
                width: 14px;
                height: 14px;
            }
            .state-message {
                padding: 40px 16px;
            }
            .state-message h3 {
                font-size: 0.9375rem;
            }
            .state-message p {
                font-size: 0.8125rem;
            }
        }

        @media (max-width: 380px) {
            .toolbar {
                padding: 0 4px;
                height: 46px;
                min-height: 46px;
            }
            .back-btn {
                font-size: 0.625rem;
                padding: 3px 6px;
            }
            .back-btn svg {
                width: 12px;
                height: 12px;
            }
            .doc-title {
                max-width: 70px;
                font-size: 0.6875rem;
            }
            .viewer-container {
                padding: 8px 4px 60px 4px;
            }
            .reader-card {
                padding: 14px 10px;
                font-size: 0.8125rem;
            }
            .reader-controls-bar .search-input {
                font-size: 0.6875rem;
                padding: 4px 8px;
            }
            .fab-summary-btn {
                bottom: 10px;
                right: 8px;
                padding: 6px 12px;
                font-size: 0.625rem;
            }
            .fab-summary-btn svg {
                width: 12px;
                height: 12px;
            }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .toolbar {
                height: 44px;
                min-height: 44px;
            }
            .viewer-container {
                padding: 10px 8px 60px 8px;
            }
            .reader-card {
                padding: 16px 14px;
                font-size: 0.8125rem;
            }
            .summary-drawer {
                max-height: 90vh;
                min-height: 50vh;
            }
            .fab-summary-btn {
                bottom: 10px;
                right: 12px;
                padding: 6px 12px;
                font-size: 0.6875rem;
            }
            .state-message {
                padding: 24px 16px;
            }
        }

        @media print {
            body {
                background: white;
                overflow: visible;
                height: auto;
            }
            .toolbar,
            .fab-summary-btn,
            .summary-overlay,
            .reader-controls-bar,
            .back-btn,
            #btnBookmark,
            #externalLink {
                display: none !important;
            }
            .viewer-container {
                padding: 20px;
                overflow: visible;
                height: auto;
            }
            .reader-card {
                box-shadow: none;
                border: 1px solid #ddd;
                border-radius: 4px;
                padding: 24px;
                max-width: 100%;
            }
            .page-wrapper {
                box-shadow: none;
                border: 1px solid #ddd;
                border-radius: 2px;
                page-break-after: always;
            }
            .page-wrapper canvas {
                max-width: 100%;
            }
            #pagesContainer {
                gap: 20px;
            }
            .state-message {
                padding: 40px;
            }
        }

        /* ============================================================
           UTILITY & ACCESSIBILITY
           ============================================================ */
        :focus-visible {
            outline: 2px solid var(--accent-green);
            outline-offset: 2px;
        }
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
        @media (prefers-contrast: high) {
            :root {
                --border-color: rgba(13, 92, 58, 0.3);
                --text-secondary: #2A3F37;
            }
            .badge {
                border-width: 1.5px;
            }
            .reader-card {
                border-width: 2px;
            }
        }
        @media (pointer: coarse) {
            .back-btn,
            .source-btn,
            .btn-icon-text,
            .fab-summary-btn,
            .summary-close-btn {
                min-height: 40px;
            }
            .back-btn {
                min-height: 36px;
            }
            .source-btn,
            .btn-icon-text {
                min-height: 34px;
            }
        }
    </style>
</head>

<body>
    <div class="toolbar">
        <div class="toolbar-left">

                <button id="btnHeaderZoomOut" class="source-btn" style="cursor: pointer; padding: 2px 7px; font-weight: bold; min-height: 26px; font-size: 15px; border: none; background: transparent; line-height: 1;" title="Zoom Out (Reduce Font/Scale)">−</button>
                <span id="headerZoomLabel" style="font-size: 11px; font-weight: 700; min-width: 36px; text-align: center; color: var(--text-primary);">100%</span>

            </div>
            <span class="badge badge-year" id="badgeYear" style="display:none;">Year</span>

            <span class="badge" id="pageInfo">Text View</span>

                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = '/lib/pdf.worker.min.js';

        let loadedDocData = null;
        let cachedSummaryHtml = null;

        const urlParams = new URLSearchParams(window.location.search);

        /* ─── Helper: Build PDF URL for Kenya Law source ─── */
        function buildKenyaLawPdfUrl(baseUrl) {

        /* ─── Production PDF-to-HTML Converter Engine ─── */
        async function processPdfToHtml(arrayBuffer) {
            try {
                loadingEl.style.display = 'block';
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let fullHtml = '';
                
                let currentParagraph = '';
                let currentListNum = '';
                let passedHeading = false;

                function buildParagraphHtml(num, text) {
                    if (!text || !text.trim()) return '';
                    if (num) {
                        return `<div class="numbered-para"><div class="para-number">${num}</div><div class="para-content">${text}</div></div>`;
                    } else {
                        return `<p>${text}</p>`;
                    }
                }

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const textContent = await page.getTextContent();
                    
                    // Group items by approximate Y coordinate (lines)
                    const lines = {};
                    textContent.items.forEach(item => {
                        const y = Math.round(item.transform[5]); 
                        if (!lines[y]) lines[y] = [];
                        lines[y].push(item);
                    });

                    // Sort lines top to bottom (PDF coordinates usually have Y=0 at bottom, so sort descending)
                    const sortedY = Object.keys(lines).map(Number).sort((a, b) => b - a);
                    
                    for (let i = 0; i < sortedY.length; i++) {
                        const y = sortedY[i];
                        // Sort items on the line left to right
                        const lineItems = lines[y].sort((a, b) => a.transform[4] - b.transform[4]);
                        
                        let lineText = lineItems.map(item => item.str).join(' ').trim();
                        lineText = lineText.replace(/\s+/g, ' ');
                        
                        if (!lineText) continue;

                        // Skip headers/footers based on content or position (heuristic)
                        if (lineText.includes('kenyalaw.org') || lineText.match(/^\[Page \d+\]$/) || lineText === 'KENYA LAW' || lineText === 'THE NATIONAL COUNCIL FOR LAW REPORTING') {
                            continue;
                        }

                        // --- Document Restructuring Heuristics ---
                        
                        // 1. Headings (Centered, All Caps, or specific keywords)
                        const isSectionHeading = lineText === 'RULING' || lineText === 'JUDGMENT' || lineText === 'Analysis and Determination' || lineText.startsWith('Whether ');
                        
                        if (isSectionHeading) {
                            if (currentParagraph) {
                                fullHtml += buildParagraphHtml(currentListNum, currentParagraph);
                                currentParagraph = '';
                                currentListNum = '';
                            }
                            
                            if (lineText === 'RULING' || lineText === 'JUDGMENT') {
                                passedHeading = true;
                                fullHtml += `<h1>${lineText}</h1>`;
                            } else {
                                fullHtml += `<h2>${lineText}</h2>`;
                            }
                            continue;
                        }

                        // 2. Center everything before the main body (Ruling/Judgment) 
                        if (!passedHeading && lineText.length < 120 && !lineText.match(/^([0-9]+\.|[ivx]+\.)\s+(.*)/i)) {
                            if (currentParagraph) {
                                fullHtml += buildParagraphHtml(currentListNum, currentParagraph);
                                currentParagraph = '';
                                currentListNum = '';
                            }
                            fullHtml += `<div class="center-text">${lineText}</div>`;
                            continue;
                        }

                        // 3. Numbered Paragraphs (e.g., "1.", "2.", "i.")
                        const listMatch = lineText.match(/^([0-9]+\.|[ivx]+\.)\s+(.*)/i);
                        
                        if (listMatch) {
                            passedHeading = true;
                            if (currentParagraph) {
                                fullHtml += buildParagraphHtml(currentListNum, currentParagraph);
                            }
                            currentListNum = listMatch[1];
                            currentParagraph = listMatch[2];
                        } else {
                            // 4. Continuation of a paragraph
                            const prevY = i > 0 ? sortedY[i-1] : null;
                            const lineSpacing = prevY ? Math.abs(prevY - y) : 0;
                            
                            if (lineSpacing > 25 && currentParagraph) {
                                 fullHtml += buildParagraphHtml(currentListNum, currentParagraph);
                                 currentListNum = '';
                                 currentParagraph = lineText;
                            } else {
                                if (currentParagraph) {
                                    if (currentParagraph.endsWith('-')) {
                                        currentParagraph = currentParagraph.slice(0, -1) + lineText;
                                    } else {
                                        currentParagraph += ' ' + lineText;
                                    }
                                } else {
                                    currentParagraph = lineText;
                                }
                            }
                        }
                    }
                }
                
                if (currentParagraph) {
                     fullHtml += buildParagraphHtml(currentListNum, currentParagraph);
                }

                if (!fullHtml || fullHtml.trim().length < 20) {
                    return false;
                }

                const cleanHtml = (typeof DOMPurify !== 'undefined') ? DOMPurify.sanitize(fullHtml) : fullHtml;
                
                renderTextReader({
                    html: `<div class="legal-doc">${cleanHtml}</div>`,
                    text: fullHtml.replace(/<[^>]+>/g, ' ')
                });

                return true;
            } catch (err) {
                console.error("Error processing PDF to HTML:", err);
                return false;
            }
        }

        /* ─── Helper: Render PDF from ArrayBuffer with High-DPI & Zoom Controls ─── */
        let globalPdfDoc = null;
        let pdfZoomLevel = 1.0;
        let baseFitScale = 1.0;

        async function renderPdfFromBuffer(arrayBuffer, totalPagesOverride) {
            cachedPdfArrayBuffer = arrayBuffer;
            if (currentViewMode === 'text') {
                const converted = await processPdfToHtml(arrayBuffer);
                if (converted) return true;
            }

            const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            globalPdfDoc = pdfDoc;
            const totalPages = totalPagesOverride || pdfDoc.numPages;
            pageInfoEl.textContent = `${totalPages} page${totalPages !== 1 ? 's' : ''}`;
            loadingEl.style.display = 'none';

            const zoomBar = document.getElementById('pdfZoomBar');
            if (zoomBar) zoomBar.style.display = 'flex';

            const firstPage = await pdfDoc.getPage(1);
            const firstViewport = firstPage.getViewport({ scale: 1 });
            const screenWidth = Math.min(window.innerWidth - (window.innerWidth < 600 ? 16 : 40), 960);

            // On mobile devices, ensure default font size is large and legible
            const isMobile = window.innerWidth < 600;
            baseFitScale = (screenWidth / firstViewport.width) * (isMobile ? 1.35 : 1.05);

            await reRenderPdfPages();
            return true;
        }

        async function reRenderPdfPages() {
            if (!globalPdfDoc) return;
            pagesContainer.innerHTML = '';

            const totalPages = globalPdfDoc.numPages;
            const effectiveScale = baseFitScale * pdfZoomLevel;

            // Output scale accounts for High-DPI / Retina mobile screens (minimum 2.0x multiplier)
            const outputScale = Math.max(window.devicePixelRatio || 1, 2.0);

            const zoomLabel = document.getElementById('pdfZoomLabel');
            if (zoomLabel) zoomLabel.textContent = `${Math.round(pdfZoomLevel * 100)}%`;

            for (let i = 1; i <= totalPages; i++) {
                const page = await globalPdfDoc.getPage(i);
                const viewport = page.getViewport({ scale: effectiveScale });

                const wrapper = document.createElement('div');
                wrapper.className = 'page-wrapper';
                if (pdfZoomLevel > 1.0) {
                    wrapper.classList.add('zoomed');
                }

                const canvas = document.createElement('canvas');
                // High resolution internal canvas buffer
                canvas.width = Math.floor(viewport.width * outputScale);
                canvas.height = Math.floor(viewport.height * outputScale);

                // CSS display dimensions match the viewport size
                canvas.style.width = Math.floor(viewport.width) + 'px';
                canvas.style.height = Math.floor(viewport.height) + 'px';

                wrapper.appendChild(canvas);
                pagesContainer.appendChild(wrapper);

                const ctx = canvas.getContext('2d');
                const transform = [outputScale, 0, 0, outputScale, 0, 0];
                await page.render({ canvasContext: ctx, viewport: viewport, transform: transform }).promise;
            }
        }

        // Attach PDF Zoom listeners
        document.getElementById('btnZoomIn')?.addEventListener('click', () => {
            if (pdfZoomLevel < 3.5) {
                pdfZoomLevel = Math.round((pdfZoomLevel + 0.25) * 100) / 100;

        document.getElementById('btnZoomOut')?.addEventListener('click', () => {

        /* ─── Top Header Zoom & Mobile Pinch-to-Zoom Controller ─── */
        function updateHeaderZoomUI() {
            const headerZoomLabel = document.getElementById('headerZoomLabel');

        function headerZoomIn() {

        function headerZoomOut() {
